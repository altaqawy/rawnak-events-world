<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152a33"><title>RAWNAK / Terrain laboratory</title><style>*{box-sizing:border-box}html,body{margin:0;background:#294957;color:white;font:12px Arial,sans-serif}body{height:240vh}body.embed{height:100vh;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#status{position:fixed;right:18px;bottom:17px;letter-spacing:.12em;font:10px Arial;opacity:.8;z-index:2;padding:7px 10px;background:#152a3355;border-radius:3px}#label{position:fixed;top:32px;left:28px;font:600 13px Arial;letter-spacing:.2em}#label small{display:block;font:10px Arial;letter-spacing:.16em;margin-top:12px}body.embed #label{display:none}body.embed #status{bottom:12px;right:12px;font-size:9px}#error{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:20px;background:#19343ee6;text-align:center}</style></head><body><canvas id="view"></canvas><div id="label">RAWNAK / WORLD LAB<small>ASSET 01 — TERRAIN · SCROLL TO FLY</small></div><div id="status">LOADING TERRAIN</div><div id="error">3D preview unavailable. Please enable WebGL.</div><script>if(new URLSearchParams(location.search).has("embed"))document.body.classList.add("embed");window.addEventListener("error",()=>{document.getElementById("status").textContent="PREVIEW UNAVAILABLE";});</script><script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";
const $=id=>document.getElementById(id),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),mix=(a,b,t)=>a+(b-a)*t,smooth=t=>t*t*(3-2*t),mobile=innerWidth<700,embed=document.body.classList.contains("embed"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

else{window.addEventListener("scroll",()=>target=clamp(scrollY/(document.body.scrollHeight-innerHeight),0,1),{passive:true});}
async function boot(){
const renderer=new THREE.WebGLRenderer({canvas:$("view"),antialias:!mobile,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.2:1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.04;

const camera=new THREE.PerspectiveCamera(48,1,.2,900);function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}resize();addEventListener("resize",resize);
const sky=new THREE.Mesh(new THREE.SphereGeometry(600,32,18),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{top:{value:new THREE.Color("#537f9c")},mid:{value:new THREE.Color("#b6d3df")},horizon:{value:new THREE.Color("#f7d8a8")}},vertexShader:"varying vec3 wp;void main(){wp=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",fragmentShader:"varying vec3 wp;uniform vec3 top,mid,horizon;void main(){vec3 d=normalize(wp);float h=d.y;vec3 c=mix(horizon,mid,smoothstep(-.12,.25,h));c=mix(c,top,smoothstep(.2,.9,h));float sun=pow(max(dot(d,normalize(vec3(-.7,.25,.55))),0.),64.);c+=vec3(1.,.65,.25)*sun*.45;gl_FragColor=vec4(c,1.); #include <tonemapping_fragment>\n#include <colorspace_fragment>\n}".replace("; #include",";\n#include") }));scene.add(sky);
scene.add(new THREE.HemisphereLight(0xe7f1ff,0x746850,2.05));const sun=new THREE.DirectionalLight(0xffe1ae,3.6);sun.position.set(-70,95,45);scene.add(sun);const rim=new THREE.DirectionalLight(0xcbe7ef,1.05);rim.position.set(30,8,-65);scene.add(rim);
const data=await fetch("./assets/world/terrain-samples.json").then(r=>{if(!r.ok)throw Error("Terrain data missing");return r.json()});const rings=data.rows.map(row=>{const a=Int8Array.from(atob(row),c=>c.charCodeAt(0));return Array.from({length:32},(_,i)=>new THREE.Vector3(a[i*3]/4,a[i*3+1]/4,a[i*3+2]/4));});

const az=160,steps=4,segments=(rings.length-1)*steps;const positions=[],colors=[],uv=[],idx=[];

function sample(r,j){const a=j/az*32,k=Math.floor(a),f=a-k;const p0=rings[r][(k+31)%32],p1=rings[r][k%32],p2=rings[r][(k+1)%32],p3=rings[r][(k+2)%32];const t=f,t2=t*t,t3=t2*t;return new THREE.Vector3().addScaledVector(p0,-.5*t3+t2-.5*t).addScaledVector(p1,1.5*t3-2.5*t2+1).addScaledVector(p2,-1.5*t3+2*t2+.5*t).addScaledVector(p3,.5*t3-.5*t2);}
for(let i=0;i<=segments;i++){const k=Math.min(rings.length-2,Math.floor(i/steps)),t=i/steps-k;for(let j=0;j<=az;j++){const q=sample(k,j).lerp(sample(k+1,j),t);const a=j/az*Math.PI*2;const side=clamp(-q.y/3,0,1)*Math.sin(Math.PI*i/segments);const rough=(Math.sin(a*33+i*.85)*.14+Math.sin(a*53-i*1.42)*.08)*side;q.x+=Math.cos(a)*rough;q.z-=Math.sin(a)*rough;q.y+=Math.sin(a*29+i*.77)*.15*side;positions.push(q.x,q.y,q.z);const grain=.5+.5*Math.sin(q.x*1.7+Math.sin(q.z*.9)*2+q.y*2.2);let c=q.y>-.4?grass.clone().lerp(sand,grain*.18):rock.clone().lerp(dark,clamp(-q.y/32,0,1)).lerp(sand,grain*.24);colors.push(c.r,c.g,c.b);uv.push(j/az*9,i/segments*7);}}
for(let i=0;i<segments;i++)for(let j=0;j<az;j++){const a=i*(az+1)+j,b=a+az+1;idx.push(a,b,b+1,a,b+1,a+1)}
const geometry=new THREE.BufferGeometry();geometry.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));geometry.setAttribute("color",new THREE.Float32BufferAttribute(colors,3));geometry.setAttribute("uv",new THREE.Float32BufferAttribute(uv,2));geometry.setIndex(idx);geometry.computeVertexNormals();
const cn=document.createElement("canvas");cn.width=cn.height=256;const cx=cn.getContext("2d"),im=cx.createImageData(256,256);let seed=4971;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let y=0;y<256;y++)for(let x=0;x<256;x++){let n=125+35*Math.sin(x*.13+Math.sin(y*.1)*3)+21*Math.sin(x*.35+y*.17)+rand()*70;let o=(y*256+x)*4;im.data[o]=im.data[o+1]=im.data[o+2]=n;im.data[o+3]=255}cx.putImageData(im,0,0);const bump=new THREE.CanvasTexture(cn);bump.wrapS=bump.wrapT=THREE.RepeatWrapping;bump.anisotropy=4;
const terrain=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.93,bumpMap:bump,bumpScale:.38,side:THREE.DoubleSide}));terrain.name="RNK_01_TERRAIN_WEB";scene.add(terrain);
const cc=document.createElement("canvas");cc.width=512;cc.height=256;const ct=cc.getContext("2d");for(let i=0;i<27;i++){const x=65+rand()*382,y=72+rand()*120,r=30+rand()*65;const g=ct.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,"rgba(255,255,255,.23)");g.addColorStop(.45,"rgba(255,255,255,.12)");g.addColorStop(1,"rgba(255,255,255,0)");ct.fillStyle=g;ct.fillRect(x-r,y-r,r*2,r*2);}const tex=new THREE.CanvasTexture(cc);tex.colorSpace=THREE.SRGBColorSpace;const clouds=[];
for(let i=0;i<(mobile?26:49);i++){const a=rand()*Math.PI*2,r=35+rand()*185;const m=new THREE.SpriteMaterial({map:tex,color:0xf0f4ee,transparent:true,opacity:.35+rand()*.35,depthWrite:false});const s=new THREE.Sprite(m);s.position.set(Math.cos(a)*r,-22-rand()*27,Math.sin(a)*r);s.scale.set(42+rand()*70,12+rand()*22,1);s.userData.x=s.position.x;scene.add(s);clouds.push(s);}
const path=new THREE.CatmullRomCurve3([new THREE.Vector3(87,51,109),new THREE.Vector3(62,28,79),new THREE.Vector3(38,17,60),new THREE.Vector3(20,10,40),new THREE.Vector3(10,9,15)],false,"catmullrom",.38);
const focus=new THREE.CatmullRomCurve3([new THREE.Vector3(-4,-4,0),new THREE.Vector3(0,-2,0),new THREE.Vector3(0,0,1),new THREE.Vector3(0,2,-8),new THREE.Vector3(0,3,-16)]);
const clock=new THREE.Clock();let last=-1;function render(){requestAnimationFrame(render);const dt=Math.min(clock.getDelta(),.05);if(!active)return;p=reduce?target:mix(p,target,1-Math.exp(-dt*6));if(Math.abs(target-p)<.0001)p=target;const cam=path.getPointAt(p);if(mobile){cam.x*=.72;cam.z*=1.22;cam.y+=8*(1-p)}camera.position.copy(cam);const aim=focus.getPoint(p);if(!mobile)aim.x-=8*(1-p);camera.lookAt(aim);sky.position.copy(cam);for(let i=0;i<clouds.length;i++)clouds[i].position.x=clouds[i].userData.x+Math.sin(p*3+i)*5;if(Math.abs(p-last)>.0001||last<0){renderer.render(scene,camera);last=p;}}
$("status").textContent="ASSET 01 · LIVE 3D / WORK IN PROGRESS";window.__rawnakTerrain={vertices:positions.length/3,triangles:idx.length/3,source:data.source};render();if(embed)parent.postMessage({type:"rawnak:terrain-ready"},location.origin);
}
boot().catch(e=>{console.error(e);$("status").textContent="PREVIEW UNAVAILABLE";$("error").style.display="block";});
</script></body></html>
